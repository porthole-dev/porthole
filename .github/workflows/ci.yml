name: CI

on:
  push:
    branches: [main]
  # `edited` is not a default type, and without it the trailers job below
  # scans the body once at open and never again -- so a clean PR edited
  # afterwards keeps a stale green. The cost is that every job reruns on a
  # title or body edit, which on this repo's volume is cheaper than the hole.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # A merge queue's candidate commits get the same jobs. The DCO range is a
  # pull request's; a merge group only carries commits that passed it.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs (a push, or a body edit) are cancelled; every
  # push to main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job below runs one make target and nothing else. The step list lives in
# the Makefile, so `make ci` on a laptop and this workflow cannot disagree --
# and tests/test_tools.py fails if a job here ever grows its own copy of the
# steps, or names a target `make ci` does not reach. Three hand-kept copies of
# this list is how a green `make check` kept shipping a red pipeline.

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the floor bin/porthole enforces. Testing it is what stops a
        # walrus operator or a 3.10 match statement quietly raising the bar for
        # someone on an older distro. `make floor` is the laptop equivalent.
        python: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # Suites (globbed, never listed), brain lint, the shell lib, the device
      # mutex. A new tests/test_*.py is picked up with nothing to remember.
      - name: make test
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install shellcheck
        # `|| true` on the update, deliberately. The runner image carries
        # third-party apt repos porthole does not use, and on 2026-09-09
        # Google's Chrome repo answered `Hash Sum mismatch`, which made
        # apt-get update exit 100 and took this job -- and with it every
        # branch's `make ci` -- down for a reason with nothing to do with the
        # change under test. The Ubuntu index had fetched fine.
        #
        # The install is what actually has to succeed, and it is NOT masked:
        # if the index is genuinely broken, that line fails loudly and names
        # shellcheck. Masking the update alone cannot hide a real problem,
        # because a lint job with no shellcheck cannot pass -- `make lint`
        # refuses to skip silently, by its own design.
        run: |
          sudo apt-get update || true
          sudo apt-get install -y shellcheck
      - name: make lint
        run: make lint

  smoke:
    name: Fresh-clone smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # tests/ci-local.sh: a fresh `git archive` of HEAD plus your uncommitted
      # work, on a bare PATH with an empty HOME. It is what a developer runs
      # before pushing, so it runs here too -- on the bare runner it imitates.
      - name: make smoke
        run: make smoke

  trailers:
    name: Commit check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The one job that needs the whole log. It asserts that no commit
          # message in the history carries a banned attribution line, and at
          # depth 1 that claim would cover a single commit and still report
          # green. The DCO check also needs the pull request's base commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Everything goes through the environment, never through the shell
      # command line: the body is attacker-controlled text on a fork pull
      # request, and `${{ }}` inside a run: block is substituted before bash
      # ever sees it. PR_BASE..PR_HEAD is the range the DCO check reads: every
      # non-merge commit in it needs a Signed-off-by from its author.
      - name: make trailers
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          # Numeric, and set by GitHub: the one thing a fork's pull request
          # cannot forge. Dependabot is exempt from the DCO, nothing else.
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: make trailers

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint and zizmor, versions pinned in porthole-dev/.github.
      - uses: porthole-dev/.github/actions/workflow-lint@b4f7bd46f772860e6f825139e2cff7d3b25d898c # v1.0.1

  ci-passed:
    # The one check for a ruleset to require: fails if any job above failed or
    # was cancelled.
    name: CI passed
    if: ${{ !cancelled() }}
    needs: [test, lint, smoke, trailers, workflow-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: porthole-dev/.github/actions/ci-passed@b4f7bd46f772860e6f825139e2cff7d3b25d898c # v1.0.1
        with:
          results: ${{ join(needs.*.result, ' ') }}
