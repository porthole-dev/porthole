name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the floor bin/porthole enforces. Testing it is what stops a
        # walrus operator or a 3.10 match statement quietly raising the bar for
        # someone on an older distro.
        python: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: config resolution
        run: python3 tests/test_config.py
      - name: cli
        run: python3 tests/test_cli.py
      - name: tool contracts
        run: python3 tests/test_tools.py
      - name: privilege broker (escape attempts)
        run: python3 tests/test_sandbox.py
      - name: pmaports index
        run: python3 tests/test_pmaports.py
      - name: shell lib (and shell/python agreement)
        run: bash tests/test_shell_lib.sh
      - name: device mutex
        run: bash tools/tk-device-test.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        # SC1091: sourcing tk-lib.sh is resolved at runtime, not statically.
        run: |
          shellcheck -S warning -e SC1091,SC2086,SC2181 \
            lib/porthole.sh $(find tools profiles/*/tools -name '*.sh' -not -type l)
      - name: python syntax
        run: python3 -m compileall -q lib bin tools tests

  smoke:
    name: fresh-clone smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: the CLI works with nothing configured
        run: |
          ./bin/porthole
          ./bin/porthole --help
          ./bin/porthole version
          ./bin/porthole devices
      - name: bootstrap headlessly, as an agent would
        run: |
          export XDG_CONFIG_HOME="$PWD/.xdg"
          ./bin/porthole init --device google-taimen --user ci --host 172.16.42.1
          ./bin/porthole config PHONE | grep -q '^ci@172.16.42.1$'
      - name: doctor reports honestly on a host with nothing installed
        run: |
          export XDG_CONFIG_HOME="$PWD/.xdg"
          # This runner has no fastboot, so doctor SHOULD exit non-zero. That
          # is the behaviour under test, not a failure -- `|| true` keeps the
          # step alive so the assertions below can check the shape of the
          # report rather than merely its exit code.
          ./bin/porthole doctor --no-device --all --json > doctor.json || true
          python3 - <<'PY'
          import json
          d = json.load(open("doctor.json"))
          assert d["checks"], "no checks ran"

          # The contract: a failure must always name a fix. A check that says
          # something is wrong without saying what to do is the thing doctor
          # exists to replace.
          for c in d["checks"]:
              assert c["status"] != "fail" or c["fix"], f"no fix offered for {c['name']}"

          # And it must actually notice a missing prerequisite rather than
          # reporting a clean bill of health on a bare runner.
          fastboot = next(c for c in d["checks"] if c["name"] == "host: fastboot")
          assert fastboot["status"] == "fail", (
              "doctor did not notice fastboot is missing on a bare runner")
          assert "install" in fastboot["fix"], (
              f"the fix should be an install command, got {fastboot['fix']!r}")

          print(f"{len(d['checks'])} checks, verdict {d['verdict']}, "
                f"{sum(1 for c in d['checks'] if c['status'] == 'fail')} fail "
                f"(expected: fastboot is absent here)")
          PY
      - name: agent surfaces are valid JSON
        run: |
          export XDG_CONFIG_HOME="$PWD/.xdg"
          ./bin/porthole brief --no-device --json | python3 -m json.tool > /dev/null
          ./bin/porthole tools --json            | python3 -m json.tool > /dev/null
          ./bin/porthole brain --json            | python3 -m json.tool > /dev/null
      - name: completions generate for every shell
        run: |
          for s in bash zsh fish; do ./bin/porthole completion $s > /dev/null; done
      - name: scaffolding a new device works
        run: |
          ./bin/porthole new-device test-device
          test -f profiles/test-device/device.env
          test -f profiles/test-device/checklist.md
