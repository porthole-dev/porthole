name: Issue trailers

# The third surface. .githooks/commit-msg holds commit messages, the trailers
# job in ci.yml holds pull request bodies, and issue #54 was filed with
# "Generated with [Claude Code]" and a session URL through the one surface
# neither of them reads. AGENTS.md section 5: a rule holds on the surfaces its
# enforcer reads. Only banned lines are removed; Assisted-by and Signed-off-by
# are the convention and stay.
#
# `edited` for the same reason ci.yml gives: without it a body is checked once
# at open and a trailer pasted in afterwards stays.
on:
  issues:
    types: [opened, edited]

# The one workflow in this repo that writes. It writes exactly one thing: the
# body of the issue that triggered it, with the banned lines deleted.
permissions:
  contents: read
  issues: write

# One run per issue; a newer edit supersedes the check of an older body.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  issue-trailers:
    name: Commit check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Through the environment, never the command line: an issue body is
      # attacker-controlled text from anyone with a GitHub account, and
      # `${{ }}` inside a run: block is substituted before bash sees it.
      - name: make issue-trailers
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: make issue-trailers
