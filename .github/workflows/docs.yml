name: Docs

# Pushes to main publish the site to GitHub Pages. Pull requests and other
# branches still generate it and run `mkdocs build --strict`, so a broken link
# or a bad nav entry fails here rather than shipping -- they just do not deploy.
#
# This was gated on a PUBLISH_DOCS repository variable while the repository was
# private, because Pages needs a plan that includes it and deploying without one
# leaves a permanent red cross on a workflow that is otherwise doing its job.
# The repository is public, so the gate is gone.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # `pages: write` here is only so configure-pages can turn Pages on by
    # itself. Without it the first push fails at deploy time with "Get Pages
    # site failed", and you have to go and flip a setting in the web UI --
    # which is a poor first experience for a repo that is otherwise
    # self-configuring.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate the site sources
        # Generation needs no dependencies -- it reads the command registry,
        # the tool headers, the profile template and brain/. Only rendering
        # needs mkdocs, which is why this step comes first and separately.
        run: ./bin/porthole docs build --org "${GITHUB_REPOSITORY%/*}" --repo "${GITHUB_REPOSITORY#*/}"

      - name: assert the site is actually generated, not committed
        # site-src/ is gitignored on purpose. If a stale copy ever gets
        # committed it will silently shadow the generated one and the published
        # docs will drift from the code.
        run: |
          git status --porcelain site-src mkdocs.yml
          test -f site-src/cli.md
          test -f site-src/tools.md
          grep -q "porthole" site-src/index.md

      - name: enable GitHub Pages if it is not already
        # enablement: true flips Settings -> Pages -> Source to "GitHub
        # Actions" over the API, so a fresh clone of this repo publishes with
        # no setting to find in the web UI.
        #
        # No continue-on-error: a failure here is real information rather than
        # noise.
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: install mkdocs
        run: pip install mkdocs-material

      - name: build (strict -- a broken link fails the build)
        run: mkdocs build --strict

      - name: upload
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
