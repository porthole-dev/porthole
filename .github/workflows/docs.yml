name: Docs

# Publishing is opt-in, gated on the PUBLISH_DOCS repository variable.
#
#   Settings -> Secrets and variables -> Actions -> Variables
#   PUBLISH_DOCS = true
#
# Unset, this workflow still generates the site and checks its local links
# on every push and pull request -- a broken link fails here rather than shipping.
# It simply does not touch GitHub Pages, which
# is what you want while the repository is private: Pages needs a plan that
# includes it, so attempting to deploy would put a permanent red cross on a
# workflow that is otherwise doing its job.
#
# The gate was removed when the repository went public and is restored now that
# it is private again. That is the whole reason it is a variable rather than a
# code change: visibility is a setting, and it has now moved twice.

on:
  push:
    branches: ["**"]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

# Builds run per pull request or branch; only deploys are serialized (see the
# deploy job). A single "pages" group for every run used to make pull requests
# wait for each other, and GitHub cancels a pending run when a newer one joins
# the group: a pull request's docs check could be cancelled by another's.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site-app/package-lock.json

      - name: Install the locked site toolchain
        run: npm ci --prefix site-app

      - name: Refresh verified public download catalogs
        run: python3 .github/scripts/site-downloads.py

      - name: Generate Starlight content
        run: ./bin/porthole docs build --org "${GITHUB_REPOSITORY%/*}" --repo "${GITHUB_REPOSITORY#*/}"

      - name: Check package search matching
        run: node site-app/test-catalog.mjs

      - name: Build the static site
        run: npm run build --prefix site-app

      - name: Check local links
        run: python3 site-app/check-links.py

      - name: Assert generated content stays out of git
        # site-src/ is gitignored on purpose. If a stale copy ever gets
        # committed it will silently shadow the generated one and the published
        # docs will drift from the code.
        run: |
          test -z "$(git ls-files -- site-src site-app/src/content/docs site-app/sidebar.generated.mjs site-app/src/assets/porthole.svg site-app/src/styles/editorial.css site-app/public/porthole.svg)"
          test -f site-src/cli.md
          test -f site-src/tools.md
          test -f site-src/downloads.md
          test -f site-app/dist/downloads/index.html
          test -f site-app/dist/devices/index.html
          grep -q "porthole" site-src/index.md
          test -f site-app/dist/index.html
          test -f site-app/dist/pagefind/pagefind.js
          python3 - <<'PY'
          from pathlib import Path
          dist = Path("site-app/dist/devices")
          profiles = Path("profiles")
          for env in profiles.glob("*/device.env"):
              if not env.parent.name.startswith("_"):
                  page = dist / env.parent.name / "index.html"
                  assert page.is_file(), f"missing device page: {page}"
          PY

      - name: Say whether this will publish
        env:
          PUBLISH_DOCS: ${{ vars.PUBLISH_DOCS }}
        run: |
          if [ "$PUBLISH_DOCS" = "true" ]; then
            echo "PUBLISH_DOCS=true — deploying to GitHub Pages."
          else
            echo "Docs built and checked, but NOT published."
            echo "PUBLISH_DOCS is not set, so GitHub Pages is left alone."
            echo "To publish: Settings -> Secrets and variables -> Actions"
            echo "            -> Variables -> PUBLISH_DOCS = true"
          fi

      - name: Upload
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_DOCS == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-app/dist

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_DOCS == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One deploy at a time, never cancelled halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    # Only the deploy can write Pages; pull request builds get a read-only token.
    permissions:
      pages: write # configure and deploy Pages
      id-token: write # deploy-pages authenticates with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages if it is not already
        # enablement: true flips Settings -> Pages -> Source to "GitHub
        # Actions" over the API, so setting PUBLISH_DOCS is all that is needed.
        # Without it the first push fails with "Get Pages site failed".
        #
        # No continue-on-error: this only runs when you have asked for
        # publishing, and a failure then is real information rather than noise.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
