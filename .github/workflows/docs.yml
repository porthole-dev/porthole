name: Docs

# Publishing is opt-in, gated on the PUBLISH_DOCS repository variable.
#
#   Settings -> Secrets and variables -> Actions -> Variables
#   PUBLISH_DOCS = true
#
# Unset, this workflow still generates the site and runs `mkdocs build
# --strict` on every push and pull request -- a broken link or a bad nav entry
# fails here rather than shipping. It simply does not touch GitHub Pages, which
# is what you want while the repository is private: Pages needs a plan that
# includes it, so attempting to deploy would put a permanent red cross on a
# workflow that is otherwise doing its job.
#
# The gate was removed when the repository went public and is restored now that
# it is private again. That is the whole reason it is a variable rather than a
# code change: visibility is a setting, and it has now moved twice.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # `pages: write` here is only so configure-pages can turn Pages on by
    # itself. Without it the first push fails at deploy time with "Get Pages
    # site failed", and you have to go and flip a setting in the web UI --
    # which is a poor first experience for a repo that is otherwise
    # self-configuring.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate the site sources
        # Generation needs no dependencies -- it reads the command registry,
        # the tool headers, the profile template and brain/. Only rendering
        # needs mkdocs, which is why this step comes first and separately.
        run: ./bin/porthole docs build --org "${GITHUB_REPOSITORY%/*}" --repo "${GITHUB_REPOSITORY#*/}"

      - name: Assert the site is actually generated, not committed
        # site-src/ is gitignored on purpose. If a stale copy ever gets
        # committed it will silently shadow the generated one and the published
        # docs will drift from the code.
        run: |
          git status --porcelain site-src mkdocs.yml
          test -f site-src/cli.md
          test -f site-src/tools.md
          grep -q "porthole" site-src/index.md

      - name: Enable GitHub Pages if it is not already
        # enablement: true flips Settings -> Pages -> Source to "GitHub
        # Actions" over the API, so setting PUBLISH_DOCS is all that is needed.
        #
        # No continue-on-error: this only runs when you have asked for
        # publishing, and a failure then is real information rather than noise.
        if: github.ref == 'refs/heads/main' && vars.PUBLISH_DOCS == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - name: Install mkdocs
        run: pip install mkdocs-material

      - name: Build (strict, a broken link fails the build)
        run: mkdocs build --strict

      - name: Say whether this will publish
        run: |
          if [ "${{ vars.PUBLISH_DOCS }}" = "true" ]; then
            echo "PUBLISH_DOCS=true — deploying to GitHub Pages."
          else
            echo "Docs built and link-checked, but NOT published."
            echo "PUBLISH_DOCS is not set, so GitHub Pages is left alone."
            echo "To publish: Settings -> Secrets and variables -> Actions"
            echo "            -> Variables -> PUBLISH_DOCS = true"
          fi

      - name: Upload
        if: github.ref == 'refs/heads/main' && vars.PUBLISH_DOCS == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
