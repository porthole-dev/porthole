<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>strip detector</title>
<!--
  Detector for the a5xx GMEM bin-column strip.

  RIGHT side (>=60% of the viewport, i.e. device x >= ~1024 at DPR 3, which is
  the clipped third bin column of a 1440-wide framebuffer) is STATIC and
  high-contrast, with long diagonals -- the feature class that GMEM defects
  smear. It must be pixel-identical in every capture.

  LEFT side carries an animation on its own layer (clipped by overflow:hidden
  and travel-capped so it can never reach the static region), so phoc keeps compositing
  the full screen every frame. Without that the screen goes idle, nothing is
  recomposited, and the detector would prove nothing.
-->
<style>
  html{margin:0;background:#000;scrollbar-width:none}
 ::-webkit-scrollbar{display:none}
 body{margin:0;background:#000}
 .spacer{height:12000px}
 .wrap{position:fixed;inset:0;display:flex;z-index:1}
 .left{width:60%;position:relative;background:#0a0a0a;overflow:hidden}
 .mover{position:absolute;left:0;top:20%;width:80px;height:200px;background:#3a3a3a;
        will-change:transform;animation:sweep 1.1s linear infinite alternate}
 @keyframes sweep{from{transform:translateX(0)}to{transform:translateX(180px)}}
 /* static, high-contrast, diagonal-heavy */
 .right{width:40%;
   background:
     repeating-linear-gradient(45deg,#fff 0 6px,#000 6px 12px),
     repeating-linear-gradient(-45deg,#888 0 18px,#111 18px 36px);
   background-blend-mode:difference}
 .marks{position:fixed;right:0;top:0;z-index:2;width:40%;height:100%;
        display:flex;flex-direction:column;justify-content:space-around;
        font:bold 28px monospace;color:#0f0;mix-blend-mode:normal}
 .marks div{background:#000;padding:2px 6px;align-self:flex-start}
</style>
<div class="wrap"><div class="left"><div class="mover"></div></div><div class="right"></div></div>
<div class="marks" id="m"></div>
<div class="spacer"></div>
<script>
var m=document.getElementById('m');
for(var i=0;i<12;i++){var d=document.createElement('div');d.textContent='ROW'+i;m.appendChild(d);}
// auto-scroll: forces whole-viewport damage each frame. Everything visible
// is position:fixed, so the rendered result must stay pixel-identical.
// Functional unlock probe: count pointer events that actually reach the page.
// phosh's lockscreen is a layer-shell surface, so it is invisible to logind,
// org.gnome.ScreenSaver and lswt -- all three report "unlocked" while it is up.
// But it DOES swallow input. So "did a synthetic tap increment this counter"
// is a real, non-visual test of whether the page is on top and interactive.
window.__taps = 0;
document.addEventListener('pointerdown', function(){ window.__taps++; }, true);
var d=1; setInterval(function(){
  var y=window.scrollY;
  if(y>4000) d=-1; else if(y<40) d=1;
  window.scrollBy(0,d*40);
},16);
document.title='strip detector ready';
</script>
