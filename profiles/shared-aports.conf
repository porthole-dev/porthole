# Packages maintained independently of a device release recommendation.
chromium
  upstream: community/chromium
  tier: optional
  why: Wayland keymap crash fix; build and publication do not establish phone usability.

crossdirect
  upstream: (none -- ours, not a fork)
  tier: required
  why: Native build helper; checked when changed, never published for the target architecture.

tap
  upstream: (none -- ours, not a fork)
  tier: optional
  why: NFC portal client maintained by this organization.

phosh-nfc-quick-setting
  upstream: (none -- ours, not a fork)
  tier: optional
  why: Phosh NFC portal integration maintained by this organization.

modemmanager
  upstream: main/modemmanager
  why: Downstream modem integration carried in the published repository.

mobile-broadband-provider-info
  upstream: main/mobile-broadband-provider-info
  why: Provider configuration carried alongside the modem stack.

libnma
  upstream: community/libnma
  why: Mobile network configuration integration.

neard
  upstream: community/neard
  why: NFC service required by the portal integration.

gnome-shell-extension-convergence
  upstream: (none -- ours, not a fork)
  tier: optional
  why: Mobile desktop integration carried in the package repository.

pinephone-callaudiod
  upstream: (none -- ours, not a fork)
  why: Call audio integration carried with the modem stack; hardware support remains separately tested.

rmtfs
  upstream: community/rmtfs
  why: Qualcomm remote filesystem service required by the device integration.

sns-reg
  upstream: (none -- ours, not a fork)
  why: Sensor registry service carried by the device integration.

soc-qcom-msm8998
  upstream: (none -- ours, not a fork)
  why: Shared SoC integration required by the device package.
