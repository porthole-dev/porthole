# What works on taimen, and the command that proves each answer.
#
#   <capability>
#     present: <command>    does the hardware/driver exist at all
#     works:   <command>    does it actually function
#
# Both are read-only and must induce nothing: `porthole matrix` is safe to run
# at any time, and a probe that leaves the phone somewhere you did not find it
# breaks AGENTS.md section 9.
#
# Leave `works:` OUT rather than inventing one. A `?` cell is honest; an
# approximate `works` probe is the thing this verb exists to stop -- taimen
# wifi was "present" for four sessions while refusing to associate to the one
# network that mattered.

# msm8998 puts the venus decoder at /dev/video7. Its absence is the ONLY
# symptom the lost venus patches produced: no module, nothing in dmesg,
# nothing in the journal.
video-decode
  present: test -e /dev/video7
  works:   v4l2-ctl -d /dev/video7 --all 2>/dev/null | grep -qi venus

# The panel never lights on mainline taimen (PORTHOLE_PANEL_STAYS_DARK=1), so
# a `works` probe that looked at the screen would report a working display as
# broken on every run. The connector's status is the honest question.
display
  present: test -e /sys/class/drm/card0
  works:   grep -qx connected /sys/class/drm/card0-DSI-1/status 2>/dev/null
