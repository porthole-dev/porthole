# What works on taimen, and the command that proves each answer.
#
#   <capability>
#     present: <command>    does the hardware/driver exist at all
#     works:   <command>    does it actually function
#
# Both are read-only and must induce nothing: `porthole matrix` is safe to run
# at any time, and a probe that leaves the phone somewhere you did not find it
# breaks AGENTS.md section 9.
#
# Leave `works:` OUT rather than inventing one. A `?` cell is honest; an
# approximate `works` probe is the thing this verb exists to stop -- taimen
# wifi was "present" for four sessions while refusing to associate to the one
# network that mattered.
#
# The panel never lights on mainline taimen (PORTHOLE_PANEL_STAYS_DARK=1), so
# any probe that looked at the screen would report working as broken on every
# run. The generic display probe already uses a glob to ask the connector's
# status, which is the honest question -- no taimen override needed.

# msm8998 puts the venus decoder at /dev/video7. Its absence is the ONLY
# symptom the lost venus patches produced: no module, nothing in dmesg,
# nothing in the journal. `present` alone is insufficient: it proves a node
# exists at a hardcoded path, and V4L2 numbering is not stable.
#
# `works` reads the driver's registered name from sysfs rather than opening
# the node. v4l2-ctl -d /dev/video7 --all answers the same question but must
# open() the node first, inducing a persistent state change: patch 0198
# calls pm_runtime_forbid() on the venus core (see
# brain/findings/venus-decode-works-and-what-it-took.md:55 "powered at first
# use, stays up while bound"). That probe was safe only while /dev/video7 was
# absent -- it would have begun powering the core exactly when venus was
# restored, which is the one scenario this probe exists to detect. A probe
# that is safe only while it is useless is not safe.
video-decode
  present: test -e /dev/video7
  works:   grep -qi venus /sys/class/video4linux/video7/name 2>/dev/null
