# What google-taimen carries on top of stock, and what breaks without each.
#
#   <aport>
#     upstream: <tree path>        where it was forked from, in aports_upstream
#     tier:     required|optional  optional = real, but a multi-hour build
#     why:      <what breaks>      mandatory; this is the whole point
#     forked:   <pkgver-pkgrel>    upstream's version at fork time
#     commit:   <sha|unknown>      aports_upstream commit at fork time
#
# WHY THIS LIST EXISTS. apk compares pkgver before pkgrel, so carrying a fork
# at -r14 protects it only while upstream's pkgver is unchanged. temp/phoc sat
# at 0.56.0 while the mirror moved to 0.57.0, apk took the newer stock build,
# and both GPU-reset patches vanished with no message anywhere -- nine hours
# of corrupt session, diagnosed as a WebKit bug. `porthole pkg drift` reads
# this file so that cannot happen quietly again.
#
# chromium is deliberately ABSENT. It segfaults on launch on this device --
# brain/findings/chromium-segfaults-because-a-phone-sends-no-xkb-keymap -- so
# it is not something this port carries.
#
# `upstream: (none -- ours, not a fork)` -- or `upstream:` left out entirely
# -- both mean "owned outright, nothing to drift against". `porthole pkg
# drift` treats either the same way: verdict `unknown`, never `unresolved`,
# never counted against the exit code. An entry with a real `upstream:` path
# that is merely wrong (typo'd, or the aport moved trees) DOES fail as
# `unresolved` -- that distinction is the whole point, so don't leave
# `upstream:` blank by accident hoping it reads as "safe".

libcamera
  upstream: community/libcamera
  tier:     required
  why:      the camera: GPU soft ISP, imx179/imx362 sensor support, contrast
            AF on the lc898214xd, and the manual exposure/gain/frame-rate/
            white-balance controls backported onto 0.7.2 (ABI-compatible with
            stock pipewire). Stock libcamera leaves the rear camera without
            focus and every camera app without manual controls. Settled
            2026-09-09 as drift, not pinning, so it is required.
  forked:   0.7.2-r0
  commit:   unknown (backfilled 2026-09-09)

device-google-taimen
  upstream: (none -- ours, not a fork)
  tier:     required
  why:      the device package itself: kernel cmdline, udev, powerhintd, and
            every /etc drop-in this phone needs.
  forked:   n/a
  commit:   n/a

linux-postmarketos-qcom-msm8998-7.2
  upstream: (none -- ours, not a fork)
  tier:     required
  why:      the kernel and its patch series.
  forked:   n/a
  commit:   n/a

firmware-google-taimen
  upstream: (none -- ours, not a fork)
  tier:     required
  why:      named in the device package's depends=; the radios and venus do
            not come up without it.
  forked:   n/a
  commit:   n/a

mesa
  upstream: main/mesa
  tier:     required
  why:      a5xx-tile-init-msaa, a5xx-msaa-sysmem and a5xx-tile-parity.
            Without them the a5xx panel strip returns and MSAA GMEM stores go
            unresolved.
  forked:   26.1.6-r0
  commit:   unknown (backfilled 2026-09-09)

phoc
  upstream: community/phoc
  tier:     required
  why:      GPU-reset survival and commit pipelining. Losing this fork once
            already cost nine hours; see the header.
  forked:   0.57.0-r0
  commit:   unknown (backfilled 2026-09-09)

gst-plugins-good
  upstream: community/gst-plugins-good
  tier:     required
  why:      the venus/dmabuf path -- without it every decoded frame is copied
            out of uncached memory.
  forked:   1.28.5-r0
  commit:   unknown (backfilled 2026-09-09)

webkit2gtk-6.0
  upstream: community/webkit2gtk-6.0
  tier:     optional
  why:      composites pixel-moving CSS filters (the multi-second YouTube
            freeze) and leads the tile prepaint. Optional only because it is
            a multi-hour build, not because it is dispensable.
  forked:   2.52.6-r0
  commit:   unknown (backfilled 2026-09-09)

epiphany
  upstream: community/epiphany
  tier:     optional
  why:      takes the overview thumbnail from the visible region, which is
            the >2 GB snapshot SIGSEGV. Multi-hour build.
  forked:   50.6-r0
  commit:   unknown (backfilled 2026-09-09)

xdg-desktop-portal
  upstream: community/xdg-desktop-portal
  tier:     required
  why:      org.freedesktop.portal.NFC -- AccessNFC, OpenNFCRemote,
            IsNFCPresent, and the xdg-dbus-proxy filter that is the whole
            security claim of the NFC permission design. Without it there is
            no portal and no per-app permission; only the raw system-bus
            org.neard API.
  forked:   1.22.1-r0
  commit:   fcb887016f4

libfprint
  upstream: community/libfprint
  tier:     required
  why:      carries the fpctee driver for the FPC trustlet sensor, which
            also serves the trustlet's two file listeners (0xa, 0x7000) its
            template database lives behind. Stock libfprint has no such
            driver: no fingerprint device is ever discovered without it
  forked:   1.94.9-r1
  commit:   fcb887016f4

fprintd
  upstream: community/fprintd
  tier:     required
  why:      unmodified content, forked only so pmbootstrap can build it
            at all -- it is the D-Bus daemon GNOME Settings and PAM talk
            to, and it does not exist in pmaports otherwise
  forked:   1.94.5-r1
  commit:   fcb887016f4

phosh
  upstream: extra-repos/systemd/phosh
  tier:     required
  why:      lock-screen fingerprint unlock
            (0001-lockscreen-Unlock-with-a-fingerprint.patch). Without it
            fingers enrol and verify through fprintd and GNOME Settings, but
            the lock screen only ever takes the passcode. Edited in place,
            not copied to temp/: pmbootstrap refuses two aports named phosh.
  forked:   99990.57.0-r1
  commit:   unknown (pmaports main, 2026-09-13)

gnome-control-center
  upstream: community/gnome-control-center
  tier:     required
  why:      privacy-add-an-nfc-page.patch (the NFC switch) and
            users-offer-fingerprint-login-without-gdm.patch: without GDM's
            login-screen schema, stock Settings hides Fingerprint Login, so
            on Phosh a finger can never be enrolled from the UI
  forked:   50.4-r0
  commit:   unknown (backfilled 2026-09-14)

obscura
  upstream: (none -- ours, not a fork)
  tier:     required
  why:      the camera app: its controls panel is generated from libcamera's
            ControlInfoMap, it saves DNG and records video. Pulled in by the
            device package; without it the only camera app has no controls.
  forked:   n/a
  commit:   n/a
