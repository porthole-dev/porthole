# What to capture either side of `porthole experiment`, and what counts as a
# dirty device on taimen.
#
#   name: command        a probe    -- recorded before and after, and diffed
#   !name: command       a confound -- ANY output means the device is dirty
#
# Every entry here was a real wrong conclusion first. On 2026-08-26 three
# findings were refuted afterwards by exactly this class of state: a leftover
# aplay holding a backend, a sound server holding a PCM, and a rootfs where
# PulseAudio rather than PipeWire owned the card.
#
# NOTE on the bracket in the pgrep patterns. `pgrep -a aplay` runs inside an ssh
# command line that itself contains the word "aplay", and the shell wrapping it
# is a process too -- so the check counts the question being asked and is never
# empty. That is brain/traps/a-journal-grep-matches-your-own-command-line.md,
# and `[a]play` is the fix: it matches the running aplay and not the pattern.

# ---------------------------------------------------------------- probes --

# Which sound server actually owns the card. A rootfs reinstall silently
# swapped PipeWire for PulseAudio, whose capture is dead on this board, and
# nothing anywhere reported it.
# XDG_RUNTIME_DIR because pactl over ssh has no session bus otherwise, and an
# unreachable server is reported as an empty string -- indistinguishable from
# 'no server running'. brain/laws/empty-must-mean-unknown-never-changed.md:
# every probe here says which of the two it means, or it cannot be diffed.
sound_server: XDG_RUNTIME_DIR=/run/user/$(id -u) pactl info 2>/dev/null | sed -n 's/^Server Name: //p' || true; XDG_RUNTIME_DIR=/run/user/$(id -u) pactl info >/dev/null 2>&1 || echo '<no server reachable>'

# The real card, versus auto_null. auto_null means no card was claimed at all,
# which reads in a test as "the driver is broken".
sinks: XDG_RUNTIME_DIR=/run/user/$(id -u) pactl list short sinks 2>/dev/null | awk '{print $2}' | tr '\n' ' ' || true

# PipeWire exposes role-based sinks including role.phone. Their presence or
# absence changes what call routing can even attempt.
roles: XDG_RUNTIME_DIR=/run/user/$(id -u) pactl list short sinks 2>/dev/null | grep -c role

# Which PCMs the ASM front-ends expose. Voice work turns on this line.
pcm: cat /proc/asound/pcm 2>/dev/null | tr '\n' ';'

# Anything holding a PCM node. A held backend is the single most common reason
# a capture is silent for a reason that has nothing to do with the patch.
# `command -v fuser` first: on a rootfs without it this printed nothing, which
# reads as 'no process holds a PCM' -- the most dangerous possible wrong answer
# for this particular probe.
snd_users: if command -v fuser >/dev/null 2>&1; then fuser /dev/snd/pcm* 2>/dev/null | tr -s ' '; else echo '<fuser absent: cannot tell>'; fi

# Whether the panel is blanked. A display experiment run against a blanked
# panel measures blanking.
blank: cat /sys/class/graphics/fb0/blank 2>/dev/null || echo '<no fb0>'

# ------------------------------------------------------------- confounds --

# A capture or playback left running by an earlier run. It holds the backend,
# so the next arm records silence and the patch under test takes the blame.
!leftover_aplay: pgrep -a '[a]play|[a]record' 2>/dev/null

# Both stacks running at once. They fight over the card, and which one wins
# varies across boots -- so a result is not reproducible and nothing says why.
!two_sound_servers: sh -c 'p=$(pgrep -c "[p]ulseaudio"); w=$(pgrep -c "[p]ipewire"); [ "$p" -gt 0 ] && [ "$w" -gt 0 ] && echo "pulseaudio=$p pipewire=$w"'

# The DSP wedged by a previous run. Once it is down, every audio result for the
# rest of the session is meaningless and nothing errors.
!adsp_down: dmesg 2>/dev/null | tail -200 | grep -i 'adsp.*\(crash\|fatal\|timeout\)' | tail -1
